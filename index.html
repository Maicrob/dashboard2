<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Panel Financiero</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root{
  --bg:#07090d; --card:rgba(255,255,255,.045); --line:rgba(255,255,255,.09);
  --text:#eef1f6; --muted:#8b94a5; --in:#34f5a0; --out:#ff5c7a; --accent:#7c8cff;
}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
body{
  font-family:'Sora',system-ui,-apple-system,'Segoe UI',sans-serif;
  background:var(--bg); color:var(--text); min-height:100vh; padding:28px 18px 60px;
  background-image:
    radial-gradient(700px 400px at 10% -5%, rgba(52,245,160,.10), transparent 60%),
    radial-gradient(700px 400px at 95% 0%, rgba(255,92,122,.10), transparent 60%);
  background-attachment:fixed;
}
.wrap{max-width:1180px;margin:0 auto}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:24px}
h1{font-size:1.6rem;font-weight:600;letter-spacing:-.02em}
.sub{color:var(--muted);font-size:.85rem;margin-top:4px}
button{
  font:inherit;font-size:.85rem;color:var(--text);background:var(--card);border:1px solid var(--line);
  padding:10px 18px;border-radius:999px;cursor:pointer;backdrop-filter:blur(14px);transition:border-color .2s
}
button:hover{border-color:var(--accent)}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.card{
  background:var(--card);border:1px solid var(--line);border-radius:24px;padding:24px;
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  box-shadow:0 20px 50px -25px rgba(0,0,0,.8), inset 0 1px 0 rgba(255,255,255,.05);
}
.card h2{font-size:.95rem;font-weight:500;color:var(--muted);margin-bottom:18px}
.grid{display:grid;gap:18px}
.kpis{grid-template-columns:repeat(3,1fr);margin-bottom:18px}
.charts{grid-template-columns:1.2fr 1fr;margin-bottom:18px}
.kpi .label{color:var(--muted);font-size:.85rem}
.kpi .value{font-size:clamp(1.6rem,3.2vw,2.3rem);font-weight:700;letter-spacing:-.03em;margin-top:10px;font-variant-numeric:tabular-nums}
.kpi.in .value{color:var(--in)} .kpi.out .value{color:var(--out)}
.kpi.bal{border-color:rgba(124,140,255,.35)}
.chart-box{position:relative;height:300px}
.empty-chart{position:absolute;inset:0;display:none;align-items:center;justify-content:center;color:var(--muted);font-size:.9rem;text-align:center;padding:20px}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:520px}
th{text-align:left;font-weight:500;font-size:.8rem;color:var(--muted);padding:0 12px 12px;border-bottom:1px solid var(--line)}
td{padding:14px 12px;border-bottom:1px solid var(--line);font-size:.92rem}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
td.fecha{color:var(--muted);white-space:nowrap}
.pill{display:inline-block;padding:4px 12px;border-radius:999px;font-size:.78rem;background:rgba(255,255,255,.07);border:1px solid var(--line)}
.pos{color:var(--in)} .neg{color:var(--out)}
.state{text-align:center;color:var(--muted);padding:36px 12px}
.state.err{color:var(--out)}
.spinner{width:28px;height:28px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--accent);margin:0 auto 14px;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.skeleton{color:transparent!important;background:linear-gradient(90deg,rgba(255,255,255,.05),rgba(255,255,255,.12),rgba(255,255,255,.05));background-size:200% 100%;border-radius:10px;animation:sh 1.3s infinite;width:70%}
@keyframes sh{to{background-position:-200% 0}}
@media(max-width:860px){.kpis,.charts{grid-template-columns:1fr}.card{padding:20px;border-radius:20px}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Panel financiero</h1>
      <p class="sub" id="updated">Conectando…</p>
    </div>
    <button id="refresh" type="button">Actualizar datos</button>
  </header>

  <section class="grid kpis">
    <article class="card kpi bal"><div class="label">Balance total</div><div class="value skeleton" id="kBal">$0</div></article>
    <article class="card kpi in"><div class="label">Total de ingresos</div><div class="value skeleton" id="kIn">$0</div></article>
    <article class="card kpi out"><div class="label">Total de gastos</div><div class="value skeleton" id="kOut">$0</div></article>
  </section>

  <section class="grid charts">
    <article class="card"><h2>Ingresos vs. gastos</h2>
      <div class="chart-box"><canvas id="barChart"></canvas><div class="empty-chart" id="barEmpty">Aún no hay datos para comparar.</div></div></article>
    <article class="card"><h2>Gastos por categoría</h2>
      <div class="chart-box"><canvas id="pieChart"></canvas><div class="empty-chart" id="pieEmpty">Aún no hay gastos registrados.</div></div></article>
  </section>

  <section class="card"><h2>Movimientos recientes</h2>
    <div class="table-wrap">
      <table>
        <thead><tr><th>Fecha</th><th>Descripción</th><th>Categoría</th><th class="num">Monto</th></tr></thead>
        <tbody id="rows"><tr><td colspan="4"><div class="state"><div class="spinner"></div>Cargando movimientos…</div></td></tr></tbody>
      </table>
    </div>
  </section>
</div>

<script>
/* ============ CONFIGURACIÓN: edita solo este bloque ============ */
const CONFIG = {
  SUPABASE_URL: "https://kmueqpazzrniuerckmgo.supabase.co/rest/v1/",
  SUPABASE_ANON_KEY: "sb_publishable_GOlJJzGgw0xsqE_bwwY4Qw_g4gN0cRh",
  TABLA: "movimientos",
  MONEDA: "CLP",          // CLP, USD, EUR, MXN, ARS...
  LOCALE: "es-CL",
  MAX_FILAS: 100          // cuántos movimientos mostrar en la tabla
};
/* ================================================================ */

const $ = id => document.getElementById(id);
const fmt = n => { try { return new Intl.NumberFormat(CONFIG.LOCALE,{style:"currency",currency:CONFIG.MONEDA,maximumFractionDigits:CONFIG.MONEDA==="CLP"?0:2}).format(n); } catch { return "$"+n; } };
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const num = v => { const n = Number(v); return Number.isFinite(n) ? n : 0; };
const esIngreso = t => String(t||"").trim().toLowerCase() === "ingreso";
const esGasto   = t => String(t||"").trim().toLowerCase() === "gasto";
const fechaTxt = f => { const d = new Date(f); return isNaN(d) ? "—" : d.toLocaleDateString(CONFIG.LOCALE,{day:"2-digit",month:"short",year:"numeric"}); };

let barChart = null, pieChart = null;

async function cargar(){
  $("refresh").disabled = true;
  try{
    const url = `${CONFIG.SUPABASE_URL}/rest/v1/${CONFIG.TABLA}?select=*&order=fecha.desc`;
    const res = await fetch(url, {
      cache: "no-store",   // siempre datos frescos
      headers: { apikey: CONFIG.SUPABASE_ANON_KEY, Authorization: `Bearer ${CONFIG.SUPABASE_ANON_KEY}` }
    });
    if(!res.ok) throw new Error(`El servidor respondió ${res.status}`);
    const datos = await res.json();
    if(!Array.isArray(datos)) throw new Error("Formato de datos inesperado");
    pintar(datos);
    $("updated").textContent = "Actualizado " + new Date().toLocaleTimeString(CONFIG.LOCALE,{hour:"2-digit",minute:"2-digit"});
  }catch(e){
    console.error(e);
    $("rows").innerHTML = `<tr><td colspan="4"><div class="state err">No se pudieron cargar los datos. Revisa tu conexión y la configuración, y toca “Actualizar datos”.</div></td></tr>`;
    $("updated").textContent = "Sin conexión con la base de datos";
  }finally{
    $("refresh").disabled = false;
  }
}

function pintar(datos){
  let ingresos = 0, gastos = 0; const cats = {};
  datos.forEach(m => {
    try{
      const monto = Math.abs(num(m.monto));
      if(esIngreso(m.tipo)) ingresos += monto;
      else if(esGasto(m.tipo)){ gastos += monto; const c = (m.categoria||"Sin categoría").toString(); cats[c] = (cats[c]||0) + monto; }
    }catch(_){ /* ignora filas dañadas */ }
  });

  [["kBal",ingresos-gastos],["kIn",ingresos],["kOut",gastos]].forEach(([id,v]) => { const el=$(id); el.classList.remove("skeleton"); el.style.width="auto"; el.textContent = fmt(v); });
  $("kBal").style.color = ingresos-gastos < 0 ? "var(--out)" : "var(--text)";

  try{ graficoBarras(ingresos, gastos); }catch(e){ console.error("Gráfico de barras:",e); }
  try{ graficoTorta(cats); }catch(e){ console.error("Gráfico circular:",e); }
  try{ tabla(datos); }catch(e){ console.error("Tabla:",e); $("rows").innerHTML = `<tr><td colspan="4"><div class="state err">No se pudo mostrar el historial.</div></td></tr>`; }
}

const chartDefaults = { color:"#8b94a5", font:{family:"Sora, sans-serif"} };

function graficoBarras(ing, gas){
  const vacio = ing === 0 && gas === 0;
  $("barEmpty").style.display = vacio ? "flex" : "none";
  if(barChart){ barChart.destroy(); barChart = null; }
  if(vacio) return;
  barChart = new Chart($("barChart"), {
    type:"bar",
    data:{ labels:["Ingresos","Gastos"], datasets:[{ data:[ing,gas], backgroundColor:["rgba(52,245,160,.85)","rgba(255,92,122,.85)"], borderRadius:14, borderSkipped:false, maxBarThickness:90 }] },
    options:{ responsive:true, maintainAspectRatio:false,
      plugins:{ legend:{display:false}, tooltip:{callbacks:{label:c=>fmt(c.parsed.y)}} },
      scales:{ x:{ticks:chartDefaults,grid:{display:false},border:{display:false}},
               y:{ticks:{...chartDefaults,callback:v=>fmt(v)},grid:{color:"rgba(255,255,255,.06)"},border:{display:false},beginAtZero:true} } }
  });
}

function graficoTorta(cats){
  const entradas = Object.entries(cats).sort((a,b)=>b[1]-a[1]);
  $("pieEmpty").style.display = entradas.length ? "none" : "flex";
  if(pieChart){ pieChart.destroy(); pieChart = null; }
  if(!entradas.length) return;
  const paleta = ["#ff5c7a","#ff8fa3","#ffb36b","#f5d76e","#c792ea","#7c8cff","#5ad1e6","#9aa5b8"];
  pieChart = new Chart($("pieChart"), {
    type:"doughnut",
    data:{ labels:entradas.map(e=>e[0]), datasets:[{ data:entradas.map(e=>e[1]), backgroundColor:entradas.map((_,i)=>paleta[i%paleta.length]), borderColor:"#07090d", borderWidth:3 }] },
    options:{ responsive:true, maintainAspectRatio:false, cutout:"62%",
      plugins:{ legend:{position:"bottom",labels:{color:"#c9d0dc",boxWidth:10,usePointStyle:true,padding:14,font:{family:"Sora, sans-serif",size:12}}},
                tooltip:{callbacks:{label:c=>` ${c.label}: ${fmt(c.parsed)}`}} } }
  });
}

function tabla(datos){
  if(!datos.length){
    $("rows").innerHTML = `<tr><td colspan="4"><div class="state">Todavía no hay movimientos. Cuando llegue el primero, aparecerá aquí.</div></td></tr>`;
    return;
  }
  $("rows").innerHTML = datos.slice(0, CONFIG.MAX_FILAS).map(m => {
    const ing = esIngreso(m.tipo);
    const monto = Math.abs(num(m.monto));
    return `<tr>
      <td class="fecha">${fechaTxt(m.fecha)}</td>
      <td>${esc(m.descripcion) || "—"}</td>
      <td><span class="pill">${esc(m.categoria) || "Sin categoría"}</span></td>
      <td class="num ${ing?"pos":"neg"}">${ing?"+":"−"}${fmt(monto)}</td>
    </tr>`;
  }).join("");
}

$("refresh").addEventListener("click", cargar);
document.addEventListener("visibilitychange", () => { if(!document.hidden) cargar(); });
cargar();
</script>
</body>
</html>
